/**:
  ros__parameters:
    # Network interface connected to Go2 (check with: ip link show)
    network_interface: "eth0"

    # Active control mode at startup: "sdk_velocity" | "nn_policy"
    control_mode: "sdk_velocity"

    # Control loop frequency (Hz)
    control_frequency: 50.0

    # Watchdog: stop robot if no /cmd_ctr received within this window (seconds)
    watchdog_timeout: 0.5

    nn_policy:
      # Path to trained ONNX policy file — leave empty until model is ready
      model_path: ""

      # Observation vector dimension (Isaac Lab Go2 default: 42)
      obs_dim: 45

      # Scale factor applied to raw network output before adding to default joint pose
      action_scale: 0.25

      # Safety bound on raw network output before scaling (training uses effectively no
      # clip; the policy outputs |>1| even when standing, so ±6 keeps normal gait intact
      # while limiting a diverging policy to ±action_clip*action_scale rad of joint offset)
      action_clip: 6.0

      # Stand-up / hold gains — used only for start·recover·stop (getting up, holding a
      # fixed stance). These are the FixStand gains from unitree_rl_lab deploy config.
      # (12 values: FR_hip, FR_thigh, FR_calf, FL_..., RR_..., RL_...)
      kp: [60.0, 80.0, 80.0, 60.0, 80.0, 80.0, 60.0, 80.0, 80.0, 60.0, 80.0, 80.0]
      kd: [5.0, 4.0, 4.0, 5.0, 4.0, 4.0, 5.0, 4.0, 4.0, 5.0, 4.0, 4.0]

      # RL walking gains — used while the policy is actively controlling (step()).
      # Must match training (env actuator stiffness=25, damping=0.5 = the policy's exported
      # params/deploy.yaml). The official deploy (State_RLBase) applies these during walking.
      # Do NOT use the stand-up gains here: the high damping blocks the leg-swing velocities
      # the gait needs, so the robot can twitch but cannot walk.
      policy_kp: [25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0]
      policy_kd: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]

      # Sim2real rollout log output base path (no extension). Empty = logging off.
      # When set, writes <log_path>.csv/.json on stop() with the real rollout.
      log_path: ""
